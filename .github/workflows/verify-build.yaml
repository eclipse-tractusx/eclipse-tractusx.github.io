# Builds the website of a pull request twice, in parallel:
#
# - "Build static website" builds the complete site, like production does, and
#   only checks that it builds (broken links fail the build). It is a required
#   status check of the main branch. Keep the job name when renaming the job.
# - "Build preview" builds a smaller site that is published as the preview. The
#   workflow "Deploy pull request preview" does not build anything, it publishes
#   the artifact uploaded here to https://eclipse-tractusx.github.io/pr/<PR-number>/.
#   Removing this job therefore also removes the previews.
#
# The previews share the gh-pages branch, and with it the size limit of GitHub
# Pages, with the production site. Every frozen KIT release is a full copy of
# all KITs (several hundred MB), so the preview only contains the KIT versions
# a pull request can change: "Next", the latest release and any older release
# the pull request touches. Older KIT releases are left out otherwise.
name: Build pull request preview

on:
  pull_request:
    branches:
      - main

# Collapse superseded runs so rapid pushes do not queue up preview deployments.
concurrency:
  group: verify-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This workflow runs code from the pull request, which may come from a fork.
# It therefore must never request write permissions or use secrets. Publishing
# the result is done by a separate, privileged workflow.
permissions:
  contents: read

# There are cases, where for example broken links will break the build, but
# checking it on the local development server (npm start) will work smoothly.
jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

  preview:
    name: Build preview
    runs-on: ubuntu-latest
    steps:
      # For a pull request the checkout is the merge commit of the pull request
      # into main. Its first parent is main, so the second commit is enough to
      # find out what the pull request changes.
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Older KIT releases are only part of the preview if the pull request
      # changes them. Releases that no longer exist (for example a release that
      # is removed by the pull request) are skipped.
      - name: Select KIT versions
        id: kit-versions
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^1 HEAD -- docs-kits_versioned_docs docs-kits_versioned_sidebars \
            | sed -nE 's#^docs-kits_versioned_docs/version-([^/]+)/.*#\1#p; s#^docs-kits_versioned_sidebars/version-(.+)-sidebars\.json$#\1#p' \
            | sort -u)"
          versions="current"
          for version in ${changed}; do
            if jq -e --arg v "${version}" 'index($v) != null' docs-kits_versions.json > /dev/null; then
              versions="${versions},${version}"
            fi
          done
          echo "KIT versions in the preview (the latest release is always included): ${versions}"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

      # The preview is served from a subfolder of the GitHub Pages site, so the
      # site has to be built with a matching baseUrl. Using the pull request
      # number keeps the path stable and unique, also for pull requests opened
      # from a fork, where two forks may use the same branch name.
      - name: Build website
        run: npm run build
        env:
          BASE_URL: /pr/${{ github.event.pull_request.number }}/
          DOCS_KITS_VERSIONS: ${{ steps.kit-versions.outputs.versions }}

      - name: Report preview size
        run: echo "::notice title=Preview size::$(du -sh ./build | cut -f1) for KIT versions ${{ steps.kit-versions.outputs.versions }} and the latest release"

      # .nojekyll is a hidden file of the build output.
      - name: Upload preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview
          path: ./build
          retention-days: 3
          include-hidden-files: true

      # The pull request number is uploaded as a separate, tiny artifact
      # because the privileged deployment workflow cannot trust any branch name
      # it receives and has no reliable way to map a fork branch back to its
      # pull request. It needs the number before downloading the build.
      - name: Write pull request number
        run: echo "${{ github.event.pull_request.number }}" > ./pr-number

      - name: Upload pull request number
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-number
          path: ./pr-number
          retention-days: 3

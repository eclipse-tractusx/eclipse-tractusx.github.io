name: Verify website build

on:
  pull_request:
    branches:
      - main

# The build output of this workflow is picked up by "Deploy pull request preview",
# which publishes it to https://eclipse-tractusx.github.io/pr/<PR-number>/.
# Collapse superseded runs so rapid pushes do not queue up preview deployments.
concurrency:
  group: verify-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# This workflow runs code from the pull request, which may come from a fork.
# It therefore must never request write permissions or use secrets. Publishing
# the result is done by a separate, privileged workflow.
permissions:
  contents: read

# This job will try to build the website to find potential issues
# before actually merging and deploying the page.
# There are cases, where for example broken links will break the build, but
# checking it on the local development server (npm start) will work smoothely.
jobs:
  build:
    name: Build static website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The preview is served from a subfolder of the GitHub Pages site, so the
      # site has to be built with a matching baseUrl. Using the pull request
      # number keeps the path stable and unique, also for pull requests opened
      # from a fork, where two forks may use the same branch name.
      - name: Build website
        run: npm run build
        env:
          BASE_URL: /pr/${{ github.event.pull_request.number }}/

      # The pull request number is written to a file because the privileged
      # deployment workflow cannot trust any branch name it receives and has no
      # reliable way to map a fork branch back to its pull request.
      - name: Write preview metadata
        run: echo "${{ github.event.pull_request.number }}" > ./build/.pr-number

      - name: Upload preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-preview
          path: ./build
          retention-days: 3
          include-hidden-files: true

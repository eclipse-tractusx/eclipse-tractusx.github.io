# Incremental secret scan: only the commits, a pull request or a push to main adds.
# The full history of main is scanned weekly by trufflehog-full.yml.
# See https://github.com/eclipse-tractusx/sig-release/issues/1797

name: "TruffleHog"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: trufflehog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ScanSecrets:
    # Job name is a required status check, keep it stable
    name: Scan secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Shallow clone with just enough history for the commits of this event
      # (pattern from the TruffleHog README, "Shallow cloning").
      - name: Determine clone depth
        id: depth
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PUSH_COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            depth=$((PR_COMMITS + 2))
          else
            depth=$(($(jq length <<< "$PUSH_COMMITS") + 2))
          fi
          echo "depth=$depth" >> "$GITHUB_OUTPUT"
          echo "Clone depth: $depth"

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Head commit of the PR (works for forks too) or the pushed commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ steps.depth.outputs.depth }}
          persist-credentials: false

      # No base/head inputs: the action then scans
      #   pull_request -> pull_request.base.sha .. pull_request.head.sha
      #   push         -> event.before .. event.after
      # The action already runs TruffleHog with --fail, so the job fails on findings.
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@7e78ca385fb82c19568c7a4b341c97d57d9aa5e1
        with:
          # Only verified (live) secrets fail the job. Unverifiable matches, such as the
          # JDBC example strings in the KIT docs, would otherwise fail every scan.
          extra_args: --only-verified --fail-on-scan-errors

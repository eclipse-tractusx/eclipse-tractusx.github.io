# Full-history secret scan of main only (not gh-pages, not other branches).
# Not a required check. Pull requests and pushes are covered by trufflehog.yml.
# See https://github.com/eclipse-tractusx/sig-release/issues/1797

name: "TruffleHog (full history)"

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-full
  cancel-in-progress: false

jobs:
  ScanSecretsFull:
    name: Scan secrets (full history of main)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Fetch the full history of main only. fetch-depth: 0 would also fetch
      # gh-pages (PR previews) and every other branch (~3 GiB instead of ~0.5 GiB).
      - name: Fetch history of main
        id: main
        run: |
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # head set, base empty: scan everything reachable from this main commit
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@7e78ca385fb82c19568c7a4b341c97d57d9aa5e1
        with:
          head: ${{ steps.main.outputs.sha }}
          extra_args: --results=verified,unknown --fail-on-scan-errors

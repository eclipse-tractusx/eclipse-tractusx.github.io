name: Pull request preview command

# Lets a committer request a preview from a comment on the pull request:
#
#   /preview                  publish the preview of this pull request. A pull
#                             request to another branch than main is not built
#                             on push; for it, /preview starts the build of the
#                             current commit, which publishes the preview
#   /preview replace <number> remove the preview of pull request <number> and
#                             publish this one in its place
#   /preview rebuild          build again when the saved build has expired
#                             (after 90 days); the build publishes the preview
#   /preview large            publish a preview that is larger than the limit
#                             for a single preview, if GitHub Pages has space
#
# When GitHub Pages has no space left, the preview comment lists the current
# previews with their sizes and the replace command for each.
#
# Runs in the context of the base repository. It never checks out or runs code
# from the pull request; it only starts "Deploy pull request preview", which
# publishes the artifact of the unprivileged build, or "Build pull request
# preview", which builds without write access or secrets.
on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  command:
    name: Handle /preview
    # Only committers. A first filter runs before a runner starts: comments from
    # people who never contributed cost nothing and get no answer, so the command
    # cannot be used to flood the pull request with bot comments or to use up
    # Actions minutes. Replacing also removes the preview of someone else's pull
    # request.
    #
    # CONTRIBUTOR is let through because GitHub reports org members whose
    # membership is private (most Eclipse committers) as CONTRIBUTOR, not MEMBER.
    # The script then checks the real permission on the repository and ignores
    # everyone without write access.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # Reactions on comments of a pull request need pull-requests: write;
    # issues: write is not enough for them.
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Start the preview deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { comment, issue, repository } = context.payload;
            const prNumber = issue.number;
            // A reaction that cannot be added must never stop the command itself.
            const react = async (content) => {
              try {
                await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: comment.id, content });
              } catch (error) {
                core.warning(`Could not add the ${content} reaction: ${error.message}`);
              }
            };
            // Feedback: 👀 as soon as the command is picked up, then 🚀 once the
            // deployment or rebuild has started, or 😕 for a command that is not
            // valid. Next to the reactions, one status comment answers the command
            // at once and says what happens and how long it takes. When the
            // deployment has finished, "Deploy pull request preview" replaces that
            // comment with the result, mentioning the requester, and adds 🎉 or 👎.
            // Only committers get a status comment, so it cannot be used to flood
            // the pull request.
            let statusId = null;
            const setStatus = async (icon, text) => {
              const body = [
                `<!-- pr-preview-status:${comment.id} -->`,
                `> ${line.replace(/[\r\n]/g, ' ').slice(0, 100)}`,
                '',
                `${icon} ${text}`,
                '',
                `<sub>Answer to [this comment](${comment.html_url}) from \`${comment.user.login}\`.</sub>`,
              ].join('\n');
              try {
                if (statusId) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: statusId, body });
                } else {
                  ({ data: { id: statusId } } = await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }));
                }
              } catch (error) {
                core.warning(`Could not write the status comment: ${error.message}`);
              }
            };

            // Only people with write access to the repository (committers). The
            // comment's author_association is not enough: org members with a
            // private membership show up as CONTRIBUTOR, like outside contributors.
            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: comment.user.login });
              permission = data.permission;
            } catch (error) {
              core.info(`Could not read the permission of ${comment.user.login}: ${error.message}`);
            }
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              core.info(`${comment.user.login} has ${permission} access, not write access. The command is ignored.`);
              return;
            }
            await react('eyes');

            const line = comment.body.trim().split('\n')[0].trim();
            await setStatus('👀', 'On it: looking for the build of this pull request. This takes a few seconds.');
            const match = line.match(/^\/preview(?:\s+replace\s+#?([1-9][0-9]{0,9})|\s+(rebuild)|\s+(large))?$/);
            if (!match) {
              await react('confused');
              await setStatus('😕', 'This is not a command I know. Use `/preview`, `/preview large`, `/preview replace <number>` or `/preview rebuild`.');
              return;
            }
            const replace = match[1] || '';
            const rebuild = Boolean(match[2]);
            const large = Boolean(match[3]);
            if (replace === String(prNumber)) {
              await react('confused');
              await setStatus('😕', '`/preview replace` needs the number of another pull request, not of this one.');
              return;
            }
            if (issue.state !== 'open') {
              await react('confused');
              await setStatus('😕', 'This pull request is closed, so it gets no preview.');
              return;
            }

            // The preview is published from the latest successful build of the pull
            // request's current commit. Its artifacts are kept for 90 days. A build
            // is never run again on its own, to save Actions minutes: when the
            // artifacts have expired, the bot says so, and /preview rebuild runs the
            // build again, which publishes the preview when it finishes. Only
            // committers get here, so this reply cannot be used to flood the pull request.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const sha = pr.head.sha;
            const shortSha = `\`${sha.slice(0, 7)}\``;
            const buildsUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/verify-build.yaml`;
            // Pull requests to main are built on every push. Pull requests to other
            // branches are built only here, as a manual run of verify-build.yaml on
            // the default branch, named after the pull request, the commit and the
            // request (see run-name in verify-build.yaml).
            const toMain = pr.base.ref === repository.default_branch;
            const dispatchTitle = `Preview of pull request #${prNumber} at ${sha} (`;
            const findRuns = async (status) => {
              const params = { owner, repo, workflow_id: 'verify-build.yaml', per_page: 100, ...(status ? { status } : {}) };
              const [{ data: pushed }, { data: dispatched }] = await Promise.all([
                github.rest.actions.listWorkflowRuns({ ...params, event: 'pull_request', head_sha: sha }),
                github.rest.actions.listWorkflowRuns({ ...params, event: 'workflow_dispatch', branch: repository.default_branch }),
              ]);
              return [...pushed.workflow_runs, ...dispatched.workflow_runs.filter((r) => r.display_title.startsWith(dispatchTitle))]
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            };
            const startBuild = async (why) => {
              if (pr.mergeable === false) {
                await react('confused');
                await setStatus('😕', `This pull request conflicts with \`${pr.base.ref}\`, so it cannot be built. Resolve the conflicts and comment \`/preview\` again.`);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'verify-build.yaml', ref: repository.default_branch,
                inputs: {
                  pr_number: String(prNumber),
                  head_sha: sha,
                  requested_by: comment.user.login,
                  comment_id: String(comment.id),
                  status_comment_id: statusId ? String(statusId) : '',
                  replace,
                  allow_large: large ? 'true' : 'false',
                },
              });
              await react('rocket');
              await setStatus('🔨', [
                `${why} I started a build of commit ${shortSha} ([build runs](${buildsUrl})). Expect 5 to 10 minutes in total:`,
                '',
                '1. The build takes 3 to 5 minutes.',
                '2. When it has finished, the preview is published to `gh-pages`, and GitHub Pages puts it online a minute or two later.',
                '',
                'This comment is then replaced by the result, which mentions you. If GitHub Pages has no space left, the preview comment lists the current previews with their sizes; comment `/preview replace <number>` to publish this one in place of one of them, without building again.',
              ].join('\n'));
            };
            const notOnPush = toMain ? '' : ` Pull requests to \`${pr.base.ref}\` are not built on push, only with \`/preview\`.`;

            const run = (await findRuns('success'))[0];
            if (!run) {
              // Tell "still running" apart from "failed" and from "never built".
              const latest = (await findRuns())[0];
              if (latest && latest.status !== 'completed') {
                // It publishes the preview on its own when it is done. The 👀 reaction stays.
                await setStatus('⏳', `When I checked, the [build](${latest.html_url}) of the latest commit (${shortSha}) was still running, and the preview is made from that build. A build usually takes 3 to 5 minutes; when it has finished, it publishes the preview on its own and the preview comment shows it, so there is no need to comment again.`);
                return;
              }
              if (latest && !rebuild) {
                await react('confused');
                await setStatus('😕', `The [build](${latest.html_url}) of the latest commit (${shortSha}) ended with \`${latest.conclusion}\`, so there is no preview to publish. Fix it and push, or comment \`/preview rebuild\` to build again.`);
                return;
              }
              await startBuild(latest ? 'Building again, as asked.' : `There is no build of the latest commit (${shortSha}) yet.${notOnPush}`);
              return;
            }
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
            if (!jobs.jobs.some((job) => job.name === 'Build preview' && job.conclusion === 'success')) {
              // The pull request does not change the website, so it has no preview.
              await react('confused');
              await setStatus('😕', 'This pull request does not change the website, so it has no preview.');
              return;
            }
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
            const available = new Set(artifacts.artifacts.filter((artifact) => !artifact.expired).map((artifact) => artifact.name));
            const expired = !available.has('pr-preview') || !available.has('pr-number');
            if (rebuild) {
              if (!expired) {
                // The build is still there: publish it, no need to build again.
                await react('confused');
                await setStatus('😕', 'The build of this pull request is still available, so there is nothing to rebuild. Comment `/preview` to publish it.');
                return;
              }
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
              await react('rocket');
              await setStatus('🔁', `Building this pull request again ([build](${run.html_url})), because its saved build has expired. The build usually takes 3 to 5 minutes and then publishes the preview on its own; with publishing, expect 5 to 10 minutes in total.`);
              return;
            }
            if (expired) {
              await react('confused');
              await setStatus('⌛', 'The build of this pull request has expired (builds are kept for 90 days), so there is no preview to publish. Comment `/preview rebuild` to build it again; the preview is published when the build has finished.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy-pr-preview.yaml',
              ref: repository.default_branch,
              inputs: {
                pr_number: String(prNumber),
                replace,
                allow_large: large ? 'true' : 'false',
                requested_by: comment.user.login,
                comment_id: String(comment.id),
                status_comment_id: statusId ? String(statusId) : '',
              },
            });
            await react('rocket');
            const what = replace ? `, replacing the preview of #${replace}` : large ? ' (allowed above the size limit)' : '';
            await setStatus('🚀', [
              `Publishing the preview of commit \`${pr.head.sha.slice(0, 7)}\`${what}. This usually takes 2 to 5 minutes, because three things happen one after another:`,
              '',
              '1. A runner starts and downloads the saved build of this pull request.',
              '2. The preview is copied to the `gh-pages` branch. If another deployment is writing there at the same moment, this one waits for it and tries again.',
              '3. GitHub Pages puts the new state of `gh-pages` online, which takes another minute or two.',
              '',
              `This comment is replaced by the result, which mentions you. [Deployment runs](${context.serverUrl}/${owner}/${repo}/actions/workflows/deploy-pr-preview.yaml)`,
            ].join('\n'));

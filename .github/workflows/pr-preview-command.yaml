name: Pull request preview command

# Lets a committer request a preview from a comment on the pull request:
#
#   /preview                  publish the preview of this pull request. A pull
#                             request to another branch than main is not built
#                             on push; for it, /preview starts the build of the
#                             current commit, which publishes the preview
#   /preview replace <number> remove the preview of pull request <number> and
#                             publish this one in its place
#   /preview rebuild          build again when the saved build has expired
#                             (after 90 days); the build publishes the preview
#   /preview status           show the current state: latest commit, its build
#                             (and the step it is at), the published preview
#   /preview refresh          like status, and also write the current state
#                             into earlier status comments that still wait
#   /preview info             explain the previews and list the commands
#
# When GitHub Pages has no space left, the status comment and the preview
# comment list the current previews with their sizes and the replace command
# for each.
#
# Runs in the context of the base repository. It never checks out or runs code
# from the pull request; it only starts "Deploy pull request preview", which
# publishes the artifact of the unprivileged build, or "Build pull request
# preview", which builds without write access or secrets.
on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

jobs:
  command:
    name: Handle /preview
    # Only committers. A first filter runs before a runner starts: comments from
    # people who never contributed cost nothing and get no answer, so the command
    # cannot be used to flood the pull request with bot comments or to use up
    # Actions minutes. Replacing also removes the preview of someone else's pull
    # request.
    #
    # CONTRIBUTOR is let through because GitHub reports org members whose
    # membership is private (most Eclipse committers) as CONTRIBUTOR, not MEMBER.
    # The script then checks the real permission on the repository and ignores
    # everyone without write access.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/preview') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # Reactions on comments of a pull request need pull-requests: write;
    # issues: write is not enough for them.
    permissions:
      actions: write
      # Reads pr/<number>/.deployed-at of gh-pages for /preview status.
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Only the scripts of the default branch, never anything from the pull
      # request: the progress shown in the status comment.
      - name: Check out preview scripts
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Start the preview deployment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { comment, issue, repository } = context.payload;
            const prNumber = issue.number;
            // A reaction that cannot be added must never stop the command itself.
            const react = async (content) => {
              try {
                await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: comment.id, content });
              } catch (error) {
                core.warning(`Could not add the ${content} reaction: ${error.message}`);
              }
            };
            // Feedback: 👀 as soon as the command is picked up, then 🚀 once the
            // deployment or rebuild has started, or 😕 for a command that is not
            // valid. Next to the reactions, one status comment answers the command
            // at once and says what happens and how long it takes. When the
            // deployment has finished, "Deploy pull request preview" writes the
            // result into that comment (the link, the reason, or the table of
            // previews to replace) and adds 🎉 or 👎.
            // Only committers get a status comment, so it cannot be used to flood
            // the pull request.
            const progress = require(`${process.env.GITHUB_WORKSPACE}/tools/.github/scripts/preview-comment.js`);
            let statusId = null;
            // A status that waits for the build or the deployment is pending:
            // "Deploy pull request preview" advances its progress and writes the
            // result into it.
            const writeStatus = async (content, pending) => {
              const body = [
                `<!-- pr-preview-status:${comment.id} -->${pending ? `\n${progress.PENDING_MARKER}` : ''}`,
                `> ${line.replace(/[\r\n]/g, ' ').slice(0, 100)}`,
                '',
                content,
                '',
                `<sub>Answer to [this comment](${comment.html_url}) from \`${comment.user.login}\`.</sub>`,
              ].join('\n');
              try {
                if (statusId) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: statusId, body });
                } else {
                  ({ data: { id: statusId } } = await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body }));
                }
              } catch (error) {
                core.warning(`Could not write the status comment: ${error.message}`);
              }
            };
            const setStatus = (icon, text) => writeStatus(`${icon} ${text}`, false);
            const setProgress = (options) => writeStatus(progress.renderProgress({ headSha: pr.head.sha, ...options }), true);
            const deploysUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/deploy-pr-preview.yaml`;

            // Only people with write access to the repository (committers). The
            // comment's author_association is not enough: org members with a
            // private membership show up as CONTRIBUTOR, like outside contributors.
            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: comment.user.login });
              permission = data.permission;
            } catch (error) {
              core.info(`Could not read the permission of ${comment.user.login}: ${error.message}`);
            }
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              core.info(`${comment.user.login} has ${permission} access, not write access. The command is ignored.`);
              return;
            }
            await react('eyes');

            const line = comment.body.trim().split('\n')[0].trim();
            await setStatus('👀', 'On it: looking for the build of this pull request. This takes a few seconds.');
            const match = line.match(/^\/preview(?:\s+replace\s+#?([1-9][0-9]{0,9})|\s+(rebuild)|\s+(status|refresh|info))?$/);
            if (!match) {
              await react('confused');
              await setStatus('😕', 'This is not a command I know. Use `/preview`, `/preview replace <number>`, `/preview rebuild`, `/preview status`, `/preview refresh` or `/preview info`.');
              return;
            }
            const replace = match[1] || '';
            const rebuild = Boolean(match[2]);
            const query = match[3] || '';
            if (replace === String(prNumber)) {
              await react('confused');
              await setStatus('😕', '`/preview replace` needs the number of another pull request, not of this one.');
              return;
            }

            // The preview is published from the latest successful build of the pull
            // request's current commit. Its artifacts are kept for 90 days. A build
            // is never run again on its own, to save Actions minutes: when the
            // artifacts have expired, the bot says so, and /preview rebuild runs the
            // build again, which publishes the preview when it finishes. Only
            // committers get here, so this reply cannot be used to flood the pull request.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const sha = pr.head.sha;
            const shortSha = `\`${sha.slice(0, 7)}\``;
            const buildsUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/verify-build.yaml`;
            // Pull requests to main are built on every push. Pull requests to other
            // branches are built only here, as a manual run of verify-build.yaml on
            // the default branch, named after the pull request, the commit and the
            // request (see run-name in verify-build.yaml).
            const toMain = pr.base.ref === repository.default_branch;
            const dispatchTitle = `Preview of pull request #${prNumber} at ${sha} (`;
            const findRuns = async (status) => {
              const params = { owner, repo, workflow_id: 'verify-build.yaml', per_page: 100, ...(status ? { status } : {}) };
              const [{ data: pushed }, { data: dispatched }] = await Promise.all([
                github.rest.actions.listWorkflowRuns({ ...params, event: 'pull_request', head_sha: sha }),
                github.rest.actions.listWorkflowRuns({ ...params, event: 'workflow_dispatch', branch: repository.default_branch }),
              ]);
              return [...pushed.workflow_runs, ...dispatched.workflow_runs.filter((r) => r.display_title.startsWith(dispatchTitle))]
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            };
            const startBuild = async (why) => {
              if (pr.mergeable === false) {
                await react('confused');
                await setStatus('😕', `This pull request conflicts with \`${pr.base.ref}\`, so it cannot be built. Resolve the conflicts and comment \`/preview\` again.`);
                return;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'verify-build.yaml', ref: repository.default_branch,
                inputs: {
                  pr_number: String(prNumber),
                  head_sha: sha,
                  requested_by: comment.user.login,
                  comment_id: String(comment.id),
                  status_comment_id: statusId ? String(statusId) : '',
                  replace,
                },
              });
              await react('rocket');
              await setProgress({
                step: 1,
                links: { build: buildsUrl },
                result: `${why} I started the build; it takes 3 to 5 minutes, then the preview is published. This comment shows each step and ends with the link, the reason it failed, or, if GitHub Pages has no space left, a table of the previews to choose one to replace.`,
              });
            };
            const notOnPush = toMain ? '' : ` Pull requests to \`${pr.base.ref}\` are not built on push, only with \`/preview\`.`;

            // /preview status, refresh and info only read: they answer for closed
            // pull requests too and start nothing.
            if (query) {
              const previewUrl = `https://${owner}.github.io/pr/${prNumber}/`;
              const time = (date) => `${date.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });

              // The published preview: gh-pages has pr/<number>/.deployed-at, and
              // the preview comment names the commit it was built from.
              let deployedAt = null;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: `pr/${prNumber}/.deployed-at`, ref: 'gh-pages' });
                const seconds = Number(Buffer.from(data.content, 'base64').toString('utf8').replace(/[^0-9]/g, ''));
                deployedAt = seconds > 0 ? new Date(seconds * 1000) : null;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              const previewComment = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(progress.MARKER));
              const publishedSha = previewComment?.body.match(/<!-- pr-preview-sha: ([0-9a-f]{40}) -->/)?.[1];

              // The latest build of the current commit, and the step it is at.
              const latest = (await findRuns())[0];
              let buildLine;
              let running = false;
              if (!latest) {
                buildLine = toMain
                  ? '⬜ not started yet; it starts on every push'
                  : '⬜ not built; comment `/preview` to build and publish it';
              } else if (latest.status !== 'completed') {
                running = true;
                const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: latest.id, per_page: 100 });
                const build = jobs.jobs.find((job) => job.name === 'Build preview' && job.status !== 'completed');
                const step = build?.steps?.find((s) => s.status === 'in_progress');
                const at = step ? `: **${step.name}**` : build ? '' : ': publishing';
                buildLine = `🔄 running${at} since ${time(new Date(latest.run_started_at || latest.created_at))} · [log](${latest.html_url})`;
              } else if (latest.conclusion === 'success') {
                buildLine = `✅ succeeded ${time(new Date(latest.updated_at))} · [log](${latest.html_url})`;
              } else {
                buildLine = `❌ ${latest.conclusion} ${time(new Date(latest.updated_at))} · [log](${latest.html_url})`;
              }

              let previewLine;
              if (!deployedAt) {
                previewLine = '⬜ not published';
              } else if (publishedSha === sha) {
                previewLine = `✅ ${previewUrl} · up to date (commit ${shortSha}) · published ${time(deployedAt)}`;
              } else {
                const which = publishedSha ? `commit \`${publishedSha.slice(0, 7)}\`` : 'an older commit';
                previewLine = `⚠️ ${previewUrl} · shows ${which}, not the latest one · published ${time(deployedAt)}`;
              }
              let next = '';
              if (issue.state !== 'open') {
                next = 'The pull request is closed, so it gets no preview.';
              } else if (running) {
                next = 'The preview is published when the build has finished; no need to comment again.';
              } else if (!deployedAt || publishedSha !== sha) {
                next = 'Comment `/preview` to publish the latest commit.';
              }
              const table = [
                `📊 **Status of the preview** · checked ${time(new Date())}`,
                '',
                '| | |',
                '|---|---|',
                `| Latest commit | ${shortSha} into \`${pr.base.ref}\` |`,
                `| Build of that commit | ${buildLine} |`,
                `| Preview | ${previewLine} |`,
                ...(next ? ['', next] : []),
              ].join('\n');

              if (query === 'info') {
                await setStatus('ℹ️', [
                  '**Pull request previews**',
                  '',
                  `This pull request's preview: ${deployedAt ? previewUrl : 'not published'}. A preview only contains the pages a pull request changes; every other page opens on the live website.`,
                  '',
                  `- Pull requests to \`${repository.default_branch}\` are built on every push and published when the build has finished.`,
                  `- Pull requests to other branches are only built when a committer comments \`/preview\`. This pull request goes into \`${pr.base.ref}\`.`,
                  '- Builds are kept for 90 days. There is no size limit for a single preview; when GitHub Pages runs out of space, a table lets a committer choose which preview to replace.',
                  '',
                  '| Command (committers) | Does |',
                  '|---|---|',
                  '| `/preview` | build if needed, then publish the latest commit |',
                  '| `/preview replace <number>` | publish this preview in place of the preview of pull request `<number>` |',
                  '| `/preview rebuild` | build again, for example when the saved build has expired |',
                  '| `/preview status` | show the latest commit, its build and the published preview |',
                  '| `/preview refresh` | like `status`, and update earlier status comments that still wait |',
                  '| `/preview info` | show this |',
                  '',
                  `[How the previews work](${context.serverUrl}/${owner}/${repo}/blob/${repository.default_branch}/.github/workflows/README.md)`,
                ].join('\n'));
                return;
              }

              let refreshed = 0;
              if (query === 'refresh') {
                // Earlier status comments that still wait for a result get the
                // current state. While something runs they stay waiting, so the
                // build or the deployment writes its progress and result into them.
                const waiting = comments.filter((c) =>
                  c.id !== statusId && c.user?.type === 'Bot' && /^<!-- pr-preview-status:[0-9]+ -->/.test(c.body || '') &&
                  (c.body.includes(progress.PENDING_MARKER) || /\n(⏳|🔨|🚀|🔁|👀) /.test(c.body)));
                for (const status of waiting) {
                  const note = running ? '' : '\n\nNothing is running any more for this request; this is the current state.';
                  await github.rest.issues.updateComment({
                    owner, repo, comment_id: status.id,
                    body: progress.statusBody(status.body, `🔄 Refreshed ${time(new Date())}\n\n${table}${note}`, running),
                  });
                  refreshed += 1;
                }
              }
              const prefix = query === 'refresh'
                ? `${refreshed === 0 ? 'No earlier status comment was waiting.' : `Updated ${refreshed} earlier status comment${refreshed === 1 ? '' : 's'} that ${refreshed === 1 ? 'was' : 'were'} still waiting.`}\n\n`
                : '';
              await setStatus('📊', `${prefix}${table}`.replace(/^📊 /, ''));
              return;
            }

            if (issue.state !== 'open') {
              await react('confused');
              await setStatus('😕', 'This pull request is closed, so it gets no preview.');
              return;
            }

            const run = (await findRuns('success'))[0];
            if (!run) {
              // Tell "still running" apart from "failed" and from "never built".
              const latest = (await findRuns())[0];
              if (latest && latest.status !== 'completed') {
                // It publishes the preview on its own when it is done. The 👀 reaction stays.
                await setProgress({
                  step: 1,
                  links: { build: latest.html_url },
                  result: 'The build of the latest commit is still running. A build usually takes 3 to 5 minutes; then the preview is published on its own and this comment shows each step, so there is no need to comment again.',
                });
                return;
              }
              if (latest && !rebuild) {
                await react('confused');
                await setStatus('😕', `The [build](${latest.html_url}) of the latest commit (${shortSha}) ended with \`${latest.conclusion}\`, so there is no preview to publish. Fix it and push, or comment \`/preview rebuild\` to build again.`);
                return;
              }
              await startBuild(latest ? 'Building again, as asked.' : `There is no build of the latest commit (${shortSha}) yet.${notOnPush}`);
              return;
            }
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
            if (!jobs.jobs.some((job) => job.name === 'Build preview' && job.conclusion === 'success')) {
              // The pull request does not change the website, so it has no preview.
              await react('confused');
              await setStatus('😕', 'This pull request does not change the website, so it has no preview.');
              return;
            }
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id, per_page: 100 });
            const available = new Set(artifacts.artifacts.filter((artifact) => !artifact.expired).map((artifact) => artifact.name));
            const expired = !available.has('pr-preview') || !available.has('pr-number');
            if (rebuild) {
              if (!expired) {
                // The build is still there: publish it, no need to build again.
                await react('confused');
                await setStatus('😕', 'The build of this pull request is still available, so there is nothing to rebuild. Comment `/preview` to publish it.');
                return;
              }
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
              await react('rocket');
              await setProgress({
                step: 1,
                links: { build: run.html_url },
                result: 'Building this pull request again, because its saved build has expired. The build takes 3 to 5 minutes and then publishes the preview on its own; this comment shows each step.',
              });
              return;
            }
            if (expired) {
              await react('confused');
              await setStatus('⌛', 'The build of this pull request has expired (builds are kept for 90 days), so there is no preview to publish. Comment `/preview rebuild` to build it again; the preview is published when the build has finished.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy-pr-preview.yaml',
              ref: repository.default_branch,
              inputs: {
                pr_number: String(prNumber),
                replace,
                requested_by: comment.user.login,
                comment_id: String(comment.id),
                status_comment_id: statusId ? String(statusId) : '',
              },
            });
            await react('rocket');
            const what = replace ? `, replacing the preview of #${replace}` : '';
            await setProgress({
              step: 2,
              links: { build: run.html_url, deploy: deploysUrl },
              result: `Publishing the saved build${what}. A runner downloads it and copies it to \`gh-pages\` (waiting if another deployment writes there at the same moment); GitHub Pages then puts it online a minute or two later. This comment shows each step.`,
            });

name: Build and deploy gh-pages

on:
  push:
    branches:
      - main

# Only production deployments share this group, so they run one after the
# other and an older build never overwrites a newer one. A deployment that is
# still waiting is replaced by a newer one, which contains its changes anyway.
# The preview workflows use their own groups. Concurrent pushes to gh-pages are
# handled by .github/scripts/update-gh-pages.sh, which retries on top of the
# latest state.
concurrency:
  group: gh-pages-production
  cancel-in-progress: false

permissions:
  contents: write
  # To tell pull requests that their preview was removed to make space.
  pull-requests: write

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # Replaces everything at the root of gh-pages with the new build, so pages
      # and hashed assets that no longer exist are removed. The pull request
      # previews in pr/ are kept. If another workflow pushed in the meantime,
      # the change is applied again on top of it. The script fetches gh-pages
      # itself and creates the branch if it does not exist yet.
      # If the site and the previews together exceed the space limit of
      # GitHub Pages (GH_PAGES_LIMIT_MB in update-gh-pages.sh), the oldest
      # previews are removed, so previews can never stop the website from being
      # deployed.
      - name: Publish to GitHub Pages
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/.github/scripts/update-gh-pages.sh" site "${GITHUB_WORKSPACE}/build"

      - name: Tell pull requests about removed previews
        if: steps.publish.outputs.evicted-previews != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EVICTED: ${{ steps.publish.outputs.evicted-previews }}
          SITE_MB: ${{ steps.publish.outputs.site-mb }}
          PREVIEWS_MB: ${{ steps.publish.outputs.previews-mb }}
          LIMIT_MB: ${{ steps.publish.outputs.limit-mb }}
        with:
          script: |
            const preview = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.js`);
            const env = process.env;
            const space = { siteMb: env.SITE_MB, previewsMb: env.PREVIEWS_MB, limitMb: env.LIMIT_MB };
            for (const prNumber of preview.numbers(env.EVICTED)) {
              await preview.update({ github, context, space, prNumber, state: 'removed', reason: 'evicted' });
              // A new comment that mentions the author, because GitHub does not
              // notify about the edited preview comment.
              await preview.notifyEvicted({ github, context, prNumber });
            }

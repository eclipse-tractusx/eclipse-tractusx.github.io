name: Build and deploy gh-pages

on:
  push:
    branches:
      - main

# Only production deployments share this group, so they run one after the
# other and an older build never overwrites a newer one. A deployment that is
# still waiting is replaced by a newer one, which contains its changes anyway.
# The preview workflows use their own groups. Concurrent pushes to gh-pages are
# handled by .github/scripts/update-gh-pages.sh, which retries on top of the
# latest state.
concurrency:
  group: gh-pages-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      # Replaces everything at the root of gh-pages with the new build, so pages
      # and hashed assets that no longer exist are removed. The pull request
      # previews in pr/ are kept. If another workflow pushed in the meantime,
      # the change is applied again on top of it. The script fetches gh-pages
      # itself and creates the branch if it does not exist yet.
      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/.github/scripts/update-gh-pages.sh" site "${GITHUB_WORKSPACE}/build"

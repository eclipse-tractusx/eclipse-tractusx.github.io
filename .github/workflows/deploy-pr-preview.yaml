name: Deploy pull request preview

# This workflow runs in the context of the base repository and therefore has
# write access, also for pull requests opened from a fork. It must never check
# out or execute code from the pull request. Everything it consumes comes from
# the artifact uploaded by "Verify website build", which runs unprivileged.
on:
  workflow_run:
    workflows:
      - Verify website build
    types:
      - completed

# All workflows writing to the gh-pages branch share this group so that they
# never push concurrently and overwrite each other.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish preview to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Download preview build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview
          path: ./build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Everything inside the artifact is untrusted input. The pull request
      # number is the only value taken from it and it is validated to be a plain
      # number before it is used as a path segment.
      - name: Read and validate pull request number
        id: pr
        run: |
          set -euo pipefail
          pr_number="$(tr -dc '0-9' < ./build/.pr-number | head -c 10)"
          if [ -z "${pr_number}" ]; then
            echo "Artifact does not contain a valid pull request number." >&2
            exit 1
          fi
          rm ./build/.pr-number
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Verify the pull request is still open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.state')"
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to GitHub Pages
        if: steps.check.outputs.state == 'open'
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: pr/${{ steps.pr.outputs.number }}
          # Never remove the production site at the root or the previews of
          # other pull requests.
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Comment preview URL on the pull request
        if: steps.check.outputs.state == 'open'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const url = `https://eclipse-tractusx.github.io/pr/${prNumber}/`;
            const body = [
              marker,
              '## 🔍 Pull request preview',
              '',
              'The website was built from this pull request and is available here:',
              '',
              `🌐 **Preview URL:** ${url}`,
              '',
              '> This comment is updated automatically on every push. The preview is removed once the pull request is closed.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

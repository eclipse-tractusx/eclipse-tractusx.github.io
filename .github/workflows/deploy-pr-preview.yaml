name: Deploy pull request preview

# This workflow runs in the context of the base repository and therefore has
# write access, also for pull requests opened from a fork. It must never check
# out or execute code from the pull request. Everything it consumes comes from
# the artifacts uploaded by "Build pull request preview", which runs
# unprivileged. It does not build anything itself.
on:
  workflow_run:
    workflows:
      - Build pull request preview
    types:
      - completed
  # Publishes the latest successful build of a pull request again, for example
  # after its preview was removed to make space. The build's artifacts are kept
  # for 90 days; after that, re-run the build or push a new commit. The
  # /preview comment command starts this run.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the pull request whose preview to publish
        required: true
        type: string
      # Set by the /preview replace <number> comment command: the preview of
      # that pull request is removed in the same commit to make space.
      replace:
        description: Pull request whose preview to remove to make space (optional)
        required: false
        type: string
        default: ''
      # Set by the /preview large comment command: publish the preview even if
      # it is larger than MAX_PREVIEW_MB. The space limit of GitHub Pages as a
      # whole still applies.
      allow_large:
        description: Publish a preview larger than MAX_PREVIEW_MB if GitHub Pages has space
        required: false
        type: boolean
        default: false
      # Set by the comment command, so the requester hears how it ended: a 🎉
      # reaction on the comment, or 👎 and a reply that mentions them.
      requested_by:
        description: Login of the committer who commented /preview (optional)
        required: false
        type: string
        default: ''
      comment_id:
        description: Id of the /preview comment (optional)
        required: false
        type: string
        default: ''
      # The status comment the command posted ("Publishing the preview..."). It
      # is replaced by the result, so the pull request keeps one answer per
      # command.
      status_comment_id:
        description: Id of the status comment of the /preview command (optional)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Finds out which pull request and which build to publish. The number is
  # needed before the deploy job starts, because it names the deploy job's
  # concurrency group.
  prepare:
    name: Identify pull request
    runs-on: ubuntu-latest
    # A build started by /preview (pull requests to another branch than main)
    # runs as workflow_dispatch on main; see verify-build.yaml. It also gets
    # here when it failed, so the requester hears about it. A cancelled build
    # was replaced by a newer one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request') ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      run-id: ${{ steps.build.outputs.run-id }}
      run-url: ${{ steps.build.outputs.run-url }}
      head-sha: ${{ steps.build.outputs.head-sha }}
      replace: ${{ steps.build.outputs.replace }}
      allow-large: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_large == true) || steps.build.outputs.allow-large == 'true' }}
      # The /preview request carried by a build that /preview started.
      pr-number: ${{ steps.build.outputs.pr-number }}
      requested-by: ${{ steps.build.outputs.requested-by }}
      comment-id: ${{ steps.build.outputs.comment-id }}
      status-comment-id: ${{ steps.build.outputs.status-comment-id }}
      build-failed: ${{ steps.build.outputs.build-failed }}
    steps:
      # A manual run publishes the latest successful build of the pull
      # request's current commit, if its artifacts still exist.
      - name: Find build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_REPLACE: ${{ inputs.replace }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A build started by /preview is named after the pull request, the
          # commit it built and the /preview request (see run-name in
          # verify-build.yaml). The name is untrusted input like any other:
          # every part must match exactly.
          title_re='^Preview of pull request #([1-9][0-9]{0,9}) at ([0-9a-f]{40}) \(/preview by ([A-Za-z0-9-]{0,39}); comment ([0-9]{0,20}); status ([0-9]{0,20}); replace ([0-9]{0,10}); large (true|false)\)$'
          pr_number="${INPUT_PR_NUMBER}"
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            run_id="${RUN_ID}"
            run_url="${RUN_URL}"
            head_sha="${RUN_HEAD_SHA}"
            if [ "${RUN_EVENT}" = "workflow_dispatch" ]; then
              if ! [[ "${RUN_TITLE}" =~ ${title_re} ]]; then
                echo "::error::The build ${run_url} is not a preview build of a pull request (${RUN_TITLE})."
                exit 1
              fi
              pr_number="${BASH_REMATCH[1]}"
              head_sha="${BASH_REMATCH[2]}"
              INPUT_REPLACE="${BASH_REMATCH[6]}"
              {
                echo "pr-number=${pr_number}"
                echo "requested-by=${BASH_REMATCH[3]}"
                echo "comment-id=${BASH_REMATCH[4]}"
                echo "status-comment-id=${BASH_REMATCH[5]}"
                echo "allow-large=${BASH_REMATCH[7]}"
              } >> "$GITHUB_OUTPUT"
              if [ "${RUN_CONCLUSION}" != "success" ]; then
                echo "::error::The build ${run_url} of pull request ${pr_number} ended with ${RUN_CONCLUSION}. Nothing to publish."
                {
                  echo "skip=true"
                  echo "build-failed=true"
                  echo "run-url=${run_url}"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # A pull request without website changes skips the build, so there
            # is nothing to publish.
            artifacts=" $(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | .name] | join(" ")') "
            if [[ "${artifacts}" != *" pr-preview "* ]]; then
              echo "The build ${run_url} made no preview (no website changes). Nothing to publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            if ! [[ "${INPUT_PR_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]]; then
              echo "::error::'${INPUT_PR_NUMBER}' is not a pull request number."
              exit 1
            fi
            head_sha="$(gh api "repos/${REPO}/pulls/${INPUT_PR_NUMBER}" --jq '.head.sha')"
            run="$(gh api "repos/${REPO}/actions/workflows/verify-build.yaml/runs?event=pull_request&status=success&head_sha=${head_sha}&per_page=1" \
              --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.html_url)"')"
            if [ -z "${run}" ]; then
              # Pull requests to another branch than main are built by /preview.
              run="$(gh api "repos/${REPO}/actions/workflows/verify-build.yaml/runs?event=workflow_dispatch&status=success&branch=${DEFAULT_BRANCH}&per_page=100" \
                | jq -r --arg title "Preview of pull request #${INPUT_PR_NUMBER} at ${head_sha} (" \
                  '[.workflow_runs[] | select(.display_title | startswith($title))][0] | select(. != null) | "\(.id) \(.html_url)"')"
            fi
            if [ -n "${run}" ]; then
              run_id="${run%% *}"
              if [ -z "$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs" --jq '.jobs[] | select(.name == "Build preview" and .conclusion == "success") | .id')" ]; then
                echo "::error::Pull request ${INPUT_PR_NUMBER} does not change the website, so it has no preview."
                exit 1
              fi
            fi
            if [ -z "${run}" ]; then
              echo "::error::There is no successful build of commit ${head_sha} of pull request ${INPUT_PR_NUMBER}. Wait for \"Build pull request preview\" to finish, or comment /preview to start one."
              exit 1
            fi
            run_id="${run%% *}"
            run_url="${run#* }"
            artifacts=" $(gh api "repos/${REPO}/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            for name in pr-preview pr-number; do
              if [[ "${artifacts}" != *" ${name} "* ]]; then
                echo "::error::The artifacts of the build ${run_url} have expired. Re-run that build (gh run rerun ${run_id} --repo ${REPO}); it then publishes the preview automatically."
                exit 1
              fi
            done
          fi
          replace=""
          if [ -n "${INPUT_REPLACE:-}" ]; then
            if ! [[ "${INPUT_REPLACE}" =~ ^[1-9][0-9]{0,9}$ ]] || [ "${INPUT_REPLACE}" = "${pr_number}" ]; then
              echo "::error::'${INPUT_REPLACE}' is not the number of another pull request's preview."
              exit 1
            fi
            replace="${INPUT_REPLACE}"
          fi
          {
            echo "run-id=${run_id}"
            echo "run-url=${run_url}"
            echo "head-sha=${head_sha}"
            echo "validate-pr-number=${pr_number}"
            echo "replace=${replace}"
          } >> "$GITHUB_OUTPUT"

      - name: Download pull request number
        if: steps.build.outputs.skip != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-number
          path: ./meta
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact is untrusted input. The number is only used if it is a
      # plain number, if it is the requested pull request (manual run) and if
      # that pull request's latest commit is the commit this build was made
      # from. Otherwise the build is outdated (a newer push will deploy) or the
      # number does not belong to this build.
      - name: Validate pull request number
        if: steps.build.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Set for a manual run and for a build started by /preview.
          INPUT_PR_NUMBER: ${{ steps.build.outputs.validate-pr-number }}
          HEAD_SHA: ${{ steps.build.outputs.head-sha }}
        run: |
          set -euo pipefail
          pr_number="$(tr -dc '0-9' < ./meta/pr-number | head -c 10)"
          if ! [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Artifact does not contain a valid pull request number." >&2
            exit 1
          fi
          if [ -n "${INPUT_PR_NUMBER}" ] && [ "${pr_number}" != "${INPUT_PR_NUMBER}" ]; then
            echo "::error::The build belongs to pull request ${pr_number}, not ${INPUT_PR_NUMBER}."
            exit 1
          fi
          head_sha="$(gh api "repos/${REPO}/pulls/${pr_number}" --jq '.head.sha')"
          if [ "${head_sha}" != "${HEAD_SHA}" ]; then
            echo "Pull request ${pr_number} is at ${head_sha}, this build is from ${HEAD_SHA}. Skipping."
            exit 0
          fi
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publish preview to GitHub Pages
    needs: prepare
    if: needs.prepare.outputs.number != ''
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.check.outputs.state }}
      mb: ${{ steps.size.outputs.mb }}
      too-large: ${{ steps.size.outputs.too-large }}
      no-space: ${{ steps.publish.outputs.no-space }}
      needed-mb: ${{ steps.publish.outputs.needed-mb }}
      previews: ${{ steps.publish.outputs.previews }}
      online: ${{ steps.verify.outputs.result }}
    # One group per pull request, shared with "Remove pull request preview".
    # Deployments and the removal of the same preview therefore never overlap.
    # Previews of different pull requests and the production deployment run in
    # parallel; update-gh-pages.sh retries a push that was rejected.
    concurrency:
      group: gh-pages-pr-${{ needs.prepare.outputs.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.prepare.outputs.number }}
      # A preview normally only contains the pages its pull request changes and
      # stays far below MAX_PREVIEW_MB. Larger previews (for example a change to
      # a component, which affects every page) are not published, so a single
      # pull request cannot take the space of all others. The build can be
      # downloaded from the workflow run instead, or a committer publishes it
      # anyway with /preview large (ALLOW_LARGE), as long as GitHub Pages has
      # space for it.
      MAX_PREVIEW_MB: 300
      ALLOW_LARGE: ${{ needs.prepare.outputs.allow-large }}
      # Previews of other pull requests are not removed automatically to make
      # space. When there is none left, the /preview status comment and the
      # preview comment list the previews, and a committer chooses one with
      # /preview replace <number>.
      PREVIEW_EVICT: none
    steps:
      # Checked again here, because the job may have waited in the concurrency
      # group. A pending removal is replaced by a newer run of this job, so a
      # pull request that was closed meanwhile is cleaned up here instead.
      - name: Check pull request state
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.state')"
          echo "Pull request ${PR_NUMBER} is ${state}."
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      # Only the scripts are taken from the default branch, never anything from
      # the pull request.
      - name: Check out deployment scripts
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Advances the progress in the /preview status comments of this pull
      # request that wait for a result: the build is done, publishing starts.
      - name: Show progress (publishing)
        if: steps.check.outputs.state == 'open'
        # The progress is information only; it must never stop the deployment.
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id || needs.prepare.outputs.status-comment-id }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          BUILD_URL: ${{ needs.prepare.outputs.run-url }}
        with:
          script: |
            const preview = require(`${process.env.GITHUB_WORKSPACE}/tools/.github/scripts/preview-comment.js`);
            const env = process.env;
            const deploy = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await preview.updateStatusComments({
              github, context, core,
              prNumber: Number(env.PR_NUMBER),
              statusId: Number(env.STATUS_COMMENT_ID) || null,
              content: preview.renderProgress({
                step: 2,
                headSha: env.HEAD_SHA,
                links: { build: env.BUILD_URL, deploy },
                result: 'The build is done. Copying it to `gh-pages`; if another deployment writes there at the same moment, this one waits and tries again.',
              }),
            });

      - name: Download preview build
        if: steps.check.outputs.state == 'open'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview
          path: ./preview
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check preview size
        id: size
        if: steps.check.outputs.state == 'open'
        run: |
          set -euo pipefail
          size="$(du -sm ./preview | cut -f1)"
          echo "The preview has ${size} MB, a single preview may use ${MAX_PREVIEW_MB} MB."
          echo "mb=${size}" >> "$GITHUB_OUTPUT"
          if [ "${size}" -gt "${MAX_PREVIEW_MB}" ]; then
            if [ "${ALLOW_LARGE}" = "true" ]; then
              echo "::notice title=Large preview::The preview has ${size} MB, more than ${MAX_PREVIEW_MB} MB. It is published anyway (/preview large) if GitHub Pages has space."
            else
              echo "::warning title=Preview too large::The preview has ${size} MB, more than ${MAX_PREVIEW_MB} MB. It is not published; a committer can publish it with /preview large."
              echo "too-large=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Replaces pr/<number> completely, so hashed assets of earlier pushes do
      # not pile up. Before pushing, the script checks the space left on GitHub
      # Pages (GH_PAGES_LIMIT_MB in update-gh-pages.sh): it removes the oldest
      # previews of other pull requests if needed, and does not publish a
      # preview that does not fit on its own. The script fetches gh-pages itself
      # and creates it if it does not exist.
      - name: Publish preview to GitHub Pages
        id: publish
        if: steps.check.outputs.state == 'open' && steps.size.outputs.too-large != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACE_PREVIEWS: ${{ needs.prepare.outputs.replace }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-gh-pages.sh" preview "${PR_NUMBER}" "${GITHUB_WORKSPACE}/preview"

      # Waits until GitHub Pages serves this deployment (pr/<number>/.deployed-at
      # has the pushed timestamp). Previews of other pull requests deploy in
      # parallel and may remove this one again to make space for theirs. Then
      # that deployment has already written the preview comment of this pull
      # request, and this job must not report the preview as published.
      #   online   GitHub Pages serves this deployment
      #   removed  gh-pages no longer has this deployment of the preview
      #   pending  pushed, but not served after the waiting time
      - name: Verify that the preview is online
        id: verify
        if: steps.publish.outputs.deployed-at != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOYED_AT: ${{ steps.publish.outputs.deployed-at }}
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id || needs.prepare.outputs.status-comment-id }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          BUILD_URL: ${{ needs.prepare.outputs.run-url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const ours = process.env.DEPLOYED_AT;
            const tools = require(`${process.env.GITHUB_WORKSPACE}/tools/.github/scripts/preview-comment.js`);
            // The progress is information only; it must never stop the check.
            await tools.updateStatusComments({
              github, context, core, prNumber,
              statusId: Number(process.env.STATUS_COMMENT_ID) || null,
              content: tools.renderProgress({
                step: 3,
                headSha: process.env.HEAD_SHA,
                links: { build: process.env.BUILD_URL, deploy: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` },
                result: 'The preview is on `gh-pages`. Waiting until GitHub Pages serves it, usually 1 to 3 minutes.',
              }),
            }).catch((error) => core.info(`Could not show the progress: ${error.message}`));
            const path = `pr/${prNumber}/.deployed-at`;
            const deadline = Date.now() + 10 * 60 * 1000;
            let result = 'pending';
            while (Date.now() < deadline) {
              let onBranch = null;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: 'gh-pages' });
                onBranch = Buffer.from(data.content, 'base64').toString('utf8').trim();
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
              if (onBranch !== ours) {
                result = 'removed';
                break;
              }
              try {
                const response = await fetch(`https://${owner}.github.io/${path}?v=${Date.now()}`, { cache: 'no-store' });
                if (response.ok && (await response.text()).trim() === ours) {
                  result = 'online';
                  break;
                }
              } catch (error) {
                core.info(`GitHub Pages did not answer: ${error.message}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 20000));
            }
            if (result === 'removed') {
              core.warning('The preview was removed again by a newer deployment on gh-pages, which has updated the preview comment.');
            } else if (result === 'pending') {
              core.warning('GitHub Pages did not serve the preview within 10 minutes.');
            } else {
              core.info('GitHub Pages serves the preview.');
            }
            core.setOutput('result', result);

      # Also removes an older, smaller preview of the same pull request, so the
      # preview never shows an outdated state.
      - name: Remove preview of closed pull request or oversized preview
        id: remove
        if: steps.check.outputs.state != 'open' || steps.size.outputs.too-large == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-gh-pages.sh" remove "${PR_NUMBER}"

      # Shows the state of the preview and the commit it was built from, and
      # tells the pull requests whose previews were removed to make space.
      - name: Update preview comments
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_STATE: ${{ steps.check.outputs.state }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          RUN_URL: ${{ needs.prepare.outputs.run-url }}
          PREVIEW_MB: ${{ steps.size.outputs.mb }}
          TOO_LARGE: ${{ steps.size.outputs.too-large }}
          NO_SPACE: ${{ steps.publish.outputs.no-space }}
          NEEDED_MB: ${{ steps.publish.outputs.needed-mb }}
          PREVIEWS: ${{ steps.publish.outputs.previews }}
          REPLACED: ${{ steps.publish.outputs.replaced-previews }}
          REMOVED: ${{ steps.remove.outputs.removed-previews }}
          EVICTED: ${{ steps.publish.outputs.evicted-previews }} ${{ steps.remove.outputs.evicted-previews }}
          SITE_MB: ${{ steps.publish.outputs.site-mb || steps.remove.outputs.site-mb }}
          PREVIEWS_MB: ${{ steps.publish.outputs.previews-mb || steps.remove.outputs.previews-mb }}
          LIMIT_MB: ${{ steps.publish.outputs.limit-mb || steps.remove.outputs.limit-mb }}
          ONLINE: ${{ steps.verify.outputs.result }}
        with:
          script: |
            const preview = require(`${process.env.GITHUB_WORKSPACE}/tools/.github/scripts/preview-comment.js`);
            const env = process.env;
            const prNumber = Number(env.PR_NUMBER);
            const space = { siteMb: env.SITE_MB, previewsMb: env.PREVIEWS_MB, limitMb: env.LIMIT_MB };
            const common = { github, context, space, headSha: env.HEAD_SHA, runUrl: env.RUN_URL, previewMb: env.PREVIEW_MB, maxPreviewMb: env.MAX_PREVIEW_MB };

            if (env.PR_STATE !== 'open') {
              const removed = preview.numbers(env.REMOVED).includes(prNumber);
              await preview.update({ ...common, prNumber, state: 'removed', reason: 'closed', create: removed });
            } else if (env.TOO_LARGE === 'true') {
              await preview.update({ ...common, prNumber, state: 'too-large' });
            } else if (env.NO_SPACE === 'true') {
              await preview.update({ ...common, prNumber, state: 'no-space', previews: env.PREVIEWS, neededMb: env.NEEDED_MB });
            } else if (env.ONLINE !== 'removed') {
              await preview.update({ ...common, prNumber, state: 'published', pagesFile: 'preview/.preview-pages.json', pagesPending: env.ONLINE === 'pending' });
            }

            for (const number of preview.numbers(env.REPLACED)) {
              await preview.update({ github, context, space, prNumber: number, state: 'removed', reason: 'replaced', replacedBy: prNumber });
              await preview.notifyReplaced({ github, context, prNumber: number, replacedBy: prNumber });
            }
            for (const number of preview.numbers(env.EVICTED)) {
              await preview.update({ github, context, space, prNumber: number, state: 'removed', reason: 'evicted' });
              await preview.notifyEvicted({ github, context, prNumber: number });
            }

  # Writes the result into the status comment that /preview posted ("Building
  # ...", "Publishing ...", "Build still running ..."): the link, or why the
  # preview was not published. When GitHub Pages has no space left, it shows
  # the table of previews to choose from with /preview replace <number>. The
  # /preview comment gets 🎉 or 👎.
  #
  # Runs for every deployment that knows its pull request, also for a push:
  # a /preview that was answered with "Build still running" is then finished
  # by the deployment of that build. Status comments that already show a
  # result are left alone. Only committers cause status comments.
  notify:
    name: Update the /preview status comment
    needs:
      - prepare
      - deploy
    if: >-
      always() &&
      (inputs.pr_number != '' || needs.prepare.outputs.pr-number != '' || needs.prepare.outputs.number != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out preview scripts
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Report the result of /preview
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # From the inputs of a manual run, or from the name of a build that
          # /preview started.
          STATUS_COMMENT_ID: ${{ inputs.status_comment_id || needs.prepare.outputs.status-comment-id }}
          PR_NUMBER: ${{ inputs.pr_number || needs.prepare.outputs.pr-number || needs.prepare.outputs.number }}
          BUILD_FAILED: ${{ needs.prepare.outputs.build-failed }}
          BUILD_URL: ${{ needs.prepare.outputs.run-url }}
          HEAD_SHA: ${{ needs.prepare.outputs.head-sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PR_STATE: ${{ needs.deploy.outputs.state }}
          PREVIEW_MB: ${{ needs.deploy.outputs.mb }}
          TOO_LARGE: ${{ needs.deploy.outputs.too-large }}
          NO_SPACE: ${{ needs.deploy.outputs.no-space }}
          NEEDED_MB: ${{ needs.deploy.outputs.needed-mb }}
          PREVIEWS: ${{ needs.deploy.outputs.previews }}
          ONLINE: ${{ needs.deploy.outputs.online }}
          MAX_PREVIEW_MB: 300
        with:
          script: |
            const env = process.env;
            const { owner, repo } = context.repo;
            const prNumber = Number(env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber < 1) {
              return;
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const url = `https://${owner}.github.io/pr/${prNumber}/`;
            const sha = /^[0-9a-f]{40}$/.test(env.HEAD_SHA || '') ? ` of commit \`${env.HEAD_SHA.slice(0, 7)}\`` : '';

            const preview = require(`${process.env.GITHUB_WORKSPACE}/tools/.github/scripts/preview-comment.js`);
            const links = { build: env.BUILD_URL, deploy: runUrl };

            // The result: the step it ended at, whether that step failed, and the text.
            let ok = false;
            let step = 5;
            let failed = false;
            let text;
            if (env.BUILD_FAILED === 'true') {
              [step, failed] = [1, true];
              text = `❌ The preview was not published: the [build](${env.BUILD_URL}) failed. Its log shows why. Fix it and push, then comment \`/preview\` again.`;
            } else if (env.PREPARE_RESULT !== 'success' || ['failure', 'cancelled'].includes(env.DEPLOY_RESULT)) {
              [step, failed] = [2, true];
              text = `❌ The preview was not published: the deployment failed. The [workflow run](${runUrl}) shows why. Comment \`/preview\` to try again.`;
            } else if (env.DEPLOY_RESULT === 'skipped') {
              // An outdated build: the build of the newer commit finishes this comment.
              return;
            } else if (env.PR_STATE !== 'open') {
              [step, failed] = [2, true];
              text = '😕 The preview was not published: the pull request is closed.';
            } else if (env.TOO_LARGE === 'true') {
              [step, failed] = [2, true];
              text = `📦 The preview${sha} was not published: it has ${env.PREVIEW_MB} MB, more than the ${env.MAX_PREVIEW_MB} MB a single preview may use. Comment \`/preview large\` to publish it anyway, if GitHub Pages has space.`;
            } else if (env.NO_SPACE === 'true') {
              [step, failed] = [2, true];
              const others = preview.parsePreviews(env.PREVIEWS).filter((other) => other.number !== prNumber);
              const needed = /^\d+$/.test(env.NEEDED_MB || '') ? ` It needs ${env.NEEDED_MB} MB more.` : '';
              text = others.length === 0
                ? `💾 The preview${sha} was not published: GitHub Pages has no space left for it, even without other previews.${needed}`
                : [
                    `💾 The preview${sha} was not published: GitHub Pages has no space left.${needed} Choose a preview to remove and comment its command; this preview is then published in its place, without building again (oldest first):`,
                    '',
                    '| Pull request | Size | Command |',
                    '|---|---:|---|',
                    ...others.map((other) => `| #${other.number} | ${other.mb} MB | \`/preview replace ${other.number}\` |`),
                  ].join('\n');
            } else if (env.ONLINE === 'removed') {
              [step, failed] = [3, true];
              text = '😕 The preview was published, but removed again right after by another deployment. Comment `/preview` to publish it again without a rebuild.';
            } else {
              ok = true;
              text = env.ONLINE === 'online'
                ? `🎉 The preview${sha} is online: ${url}\n\nThe preview comment lists the pages this pull request changes.`
                : `🎉 The preview${sha} is published: ${url}\n\nGitHub Pages did not serve it within 10 minutes. If the link shows an older state or "Page not found", wait a few minutes.`;
            }

            // Finishes the status comment of this request and any other /preview
            // status comment of the pull request that still waits for a result
            // (for example "build still running" before a push build).
            await preview.updateStatusComments({
              github, context, core, prNumber,
              statusId: /^[1-9][0-9]{0,19}$/.test(env.STATUS_COMMENT_ID || '') ? Number(env.STATUS_COMMENT_ID) : null,
              content: preview.renderProgress({ step, failed, headSha: env.HEAD_SHA, links, result: text }),
              reaction: ok ? 'hooray' : '-1',
            });

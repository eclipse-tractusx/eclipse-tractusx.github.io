name: Deploy pull request preview

# This workflow runs in the context of the base repository and therefore has
# write access, also for pull requests opened from a fork. It must never check
# out or execute code from the pull request. Everything it consumes comes from
# the artifacts uploaded by "Build pull request preview", which runs
# unprivileged. It does not build anything itself.
on:
  workflow_run:
    workflows:
      - Build pull request preview
    types:
      - completed

permissions:
  contents: read

jobs:
  # Finds out which pull request the build belongs to. The number is needed
  # before the deploy job starts, because it names the deploy job's
  # concurrency group.
  prepare:
    name: Identify pull request
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Download pull request number
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-number
          path: ./meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact is untrusted input. The number is only used if it is a
      # plain number and if that pull request's latest commit is the commit
      # this build was made from. Otherwise the build is outdated (a newer
      # push will deploy) or the number does not belong to this build.
      - name: Validate pull request number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(tr -dc '0-9' < ./meta/pr-number | head -c 10)"
          if ! [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Artifact does not contain a valid pull request number." >&2
            exit 1
          fi
          head_sha="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.sha')"
          if [ "${head_sha}" != "${RUN_HEAD_SHA}" ]; then
            echo "Pull request ${pr_number} is at ${head_sha}, this build is from ${RUN_HEAD_SHA}. Skipping."
            exit 0
          fi
          echo "number=${pr_number}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publish preview to GitHub Pages
    needs: prepare
    if: needs.prepare.outputs.number != ''
    runs-on: ubuntu-latest
    # One group per pull request, shared with "Remove pull request preview".
    # Deployments and the removal of the same preview therefore never overlap.
    # Previews of different pull requests and the production deployment run in
    # parallel; update-gh-pages.sh retries a push that was rejected.
    concurrency:
      group: gh-pages-pr-${{ needs.prepare.outputs.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ needs.prepare.outputs.number }}
      # A preview normally only contains the pages its pull request changes and
      # stays far below MAX_PREVIEW_MB. Larger previews (for example a change to
      # a component, which affects every page) are not published, the build can
      # be downloaded from the workflow run instead.
      MAX_PREVIEW_MB: 300
      # Maximum size of all previews together. update-gh-pages.sh removes the
      # oldest previews beyond it. Keep in sync with "Build and deploy gh-pages".
      PREVIEW_BUDGET_MB: 1000
    steps:
      # Checked again here, because the job may have waited in the concurrency
      # group. A pending removal is replaced by a newer run of this job, so a
      # pull request that was closed meanwhile is cleaned up here instead.
      - name: Check pull request state
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          state="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.state')"
          echo "Pull request ${PR_NUMBER} is ${state}."
          echo "state=${state}" >> "$GITHUB_OUTPUT"

      # Only the script is taken from the default branch, never anything from
      # the pull request.
      - name: Check out deployment script
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download preview build
        if: steps.check.outputs.state == 'open'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-preview
          path: ./preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check preview size
        id: size
        if: steps.check.outputs.state == 'open'
        run: |
          set -euo pipefail
          size="$(du -sm ./preview | cut -f1)"
          echo "The preview has ${size} MB, the limit is ${MAX_PREVIEW_MB} MB."
          echo "mb=${size}" >> "$GITHUB_OUTPUT"
          if [ "${size}" -gt "${MAX_PREVIEW_MB}" ]; then
            echo "too-large=true" >> "$GITHUB_OUTPUT"
          fi

      # Replaces pr/<number> completely, so hashed assets of earlier pushes do
      # not pile up. The production site stays untouched; the oldest other
      # previews are removed if all previews exceed PREVIEW_BUDGET_MB. The script
      # fetches gh-pages itself and creates it if it does not exist.
      - name: Publish preview to GitHub Pages
        id: publish
        if: steps.check.outputs.state == 'open' && steps.size.outputs.too-large != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-gh-pages.sh" preview "${PR_NUMBER}" "${GITHUB_WORKSPACE}/preview"

      # Also removes an older, smaller preview of the same pull request, so the
      # preview never shows an outdated state.
      - name: Remove preview of closed pull request or oversized preview
        if: steps.check.outputs.state != 'open' || steps.size.outputs.too-large == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/tools/.github/scripts/update-gh-pages.sh" remove "${PR_NUMBER}"

      # .preview-pages.json comes from the pull request build and is untrusted:
      # only plain paths are used, and only as links below the preview URL.
      - name: Comment preview URL on the pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_STATE: ${{ steps.check.outputs.state }}
          PREVIEW_MB: ${{ steps.size.outputs.mb }}
          TOO_LARGE: ${{ steps.size.outputs.too-large }}
          REMOVED_PREVIEWS: ${{ steps.publish.outputs.removed-previews }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-preview-comment -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const site = 'https://eclipse-tractusx.github.io';
            const url = `${site}/pr/${prNumber}/`;
            const maxListed = 15;

            let pages = [];
            try {
              const parsed = JSON.parse(fs.readFileSync('preview/.preview-pages.json', 'utf8'));
              if (Array.isArray(parsed)) {
                pages = parsed.filter((page) => typeof page === 'string' && /^\/[A-Za-z0-9._~\/%-]{0,300}$/.test(page) && !page.includes('..'));
              }
            } catch {
              // No list of changed pages, for example a build of an older version of the workflow.
            }
            const pageList = pages.slice(0, maxListed).map((page) => `- [\`${page}\`](${url}${page.slice(1)})`);
            if (pages.length > maxListed) {
              pageList.push(`- … and ${pages.length - maxListed} more`);
            }

            let body;
            if (process.env.PR_STATE !== 'open') {
              body = [marker, '## 🔍 Pull request preview', '', 'This pull request is closed, so the preview has been removed.'].join('\n');
            } else if (process.env.TOO_LARGE === 'true') {
              body = [
                marker,
                '## 🔍 Pull request preview',
                '',
                `The preview has ${process.env.PREVIEW_MB} MB, more than the ${process.env.MAX_PREVIEW_MB} MB a preview may use on GitHub Pages, so it is not published. This happens when a change affects every page, for example a change to a component, a style or the configuration.`,
                '',
                `📦 Download the \`pr-preview\` artifact from the [build](${process.env.RUN_URL}) and serve it locally, or build the preview locally as described in the README.`,
              ].join('\n');
            } else {
              body = [
                marker,
                '## 🔍 Pull request preview',
                '',
                `🌐 **Preview URL:** ${url}`,
                '',
                pages.length > 0
                  ? 'The preview only contains the pages this pull request changes:'
                  : 'This pull request does not change any page of the website.',
                '',
                ...pageList,
                '',
                '> All other pages of the preview open on the live website. This comment is updated automatically on every push. The preview is removed once the pull request is closed, or earlier if newer previews need the space; push again to bring it back.',
              ].join('\n');
            }

            async function upsertComment(issueNumber, text, createIfMissing) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: text,
                });
              } else if (createIfMissing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: text,
                });
              }
            }

            await upsertComment(prNumber, body, process.env.PR_STATE === 'open');

            // Previews removed to make space for this one.
            const removed = (process.env.REMOVED_PREVIEWS || '').split(' ').filter((n) => /^[1-9][0-9]{0,9}$/.test(n));
            for (const number of removed) {
              await upsertComment(Number(number), [
                marker,
                '## 🔍 Pull request preview',
                '',
                `The preview was removed to make space for newer previews on GitHub Pages. Push a new commit to publish it again.`,
              ].join('\n'), false);
            }

# Keeps the numbers on the product pages current (activity, People and Statistics tabs)
# without rebuilding the site: collects them with utils/generateProductStats.js and
# replaces only generated/product-stats.json on gh-pages. The site reads that file in the
# browser, so a new file is live as soon as GitHub Pages has published the branch.

name: Update product statistics

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# One update at a time. Pushes of other workflows to gh-pages are handled by
# .github/scripts/update-gh-pages.sh, which retries on top of the latest state.
concurrency:
  group: product-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Collect and publish product statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # The script only uses Node built-ins, so there is nothing to install.
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20

      # --strict: fails, and writes nothing, when fewer than 90% of the repositories or no
      # committers answered, so a bad run never replaces good numbers.
      - name: Collect product statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node utils/generateProductStats.js --strict

      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "${RUNNER_TEMP}/gh-pages"
          cd "${RUNNER_TEMP}/gh-pages"
          bash "${GITHUB_WORKSPACE}/.github/scripts/update-gh-pages.sh" data "${GITHUB_WORKSPACE}/static/generated"

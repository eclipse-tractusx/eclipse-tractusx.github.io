tos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 417.059 2259)">Early demand and capacity signals preserve </text><text fill="#E9EDF2" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 417.059 2311)">options for action.</text><text fill="#57D9A3" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="44" transform="matrix(1 0 0 1 417.059 2185)">Step 1</text><text fill="#57D9A3" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="44" transform="matrix(1 0 0 1 540.236 2185)">–</text><text fill="#57D9A3" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="44" transform="matrix(1 0 0 1 560.288 2185)">2</text><path d="M355 2168C355 2160.82 360.82 2155 368 2155 375.18 2155 381 2160.82 381 2168 381 2175.18 375.18 2181 368 2181 360.82 2181 355 2175.18 355 2168Z" fill="#57D9A3" fill-rule="evenodd"/><text fill="#E9EDF2" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 1840.04 2259)">Binding planning and dispatch decisions reduce </text><text fill="#E9EDF2" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="400" font-size="44" transform="matrix(1 0 0 1 1840.04 2311)">alternatives.</text><text fill="#A4C5F7" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="44" transform="matrix(1 0 0 1 1840.04 2185)">Step 3 </text><text fill="#A4C5F7" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="44" transform="matrix(1 0 0 1 1971.81 2185)">-</text><text fill="#A4C5F7" font-family="Aptos,Aptos_MSFontService,sans-serif" font-weight="700" font-size="44" transform="matrix(1 0 0 1 1995.3 2185)">4</text><path d="M1778 2168C1778 2160.82 1783.82 2155 1791 2155 1798.18 2155 1804 2160.82 1804 2168 1804 2175.18 1798.18 2181 1791 2181 1783.82 2181 1778 2175.18 1778 2168Z" fill="#A4C5F7
       CENTRE CONNECTIONS
  ══════════════════════════════════════════ -->

  <!-- EDC Control Plane ↔ Control Plane (DSP) -->
  <line x1="313" y1="408" x2="647" y2="408" stroke="#4A8C4A" stroke-width="2" marker-end="url(#arrow-green)" marker-start="url(#arrow-green-left)"/>
  <rect x="360" y="393" width="240" height="29" rx="4" fill="white" stroke="#4A8C4A" stroke-width="1"/>
  <text x="480" y="406" text-anchor="middle" font-size="10" font-weight="bold" fill="#2D5A2D">Dataspace Protocol (DSP)</text>
  <text x="480" y="418" text-anchor="middle" font-size="9" fill="#555">Catalog · Contract negotiation · Transfer init</text>

  <!-- EDC Data Plane ↔ Data Plane (AAS transfer) -->
  <line x1="313" y1="448" x2="647" y2="448" stroke="#4A8C4A" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-green)" marker-start="url(#arrow-green-left)"/>
  <rect x="370" y="435" width="220" height="24" rx="4" fill="white" stroke="#4A8C4A" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="480" y="451" text-anchor="middle" font-size="10" fill="#2D5A2D">AAS Package Access (HTTPS)</text>

  <!-- ══════════════════════════════════════════

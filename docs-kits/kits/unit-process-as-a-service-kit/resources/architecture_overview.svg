  <line x1="370" y1="520" x2="395" y2="520" stroke="#888" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-grey)"/>
  <text x="400" y="524" font-size="9" fill="#333">Physical material flow</text>
  <line x1="370" y1="538" x2="395" y2="538" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <text x="400" y="542" font-size="9" fill="#333">Marketplace registration</text>

  <!-- Physical wafer exchange (bottom) — moved down to y=640 -->
  <line x1="313" y1="640" x2="647" y2="640" stroke="#888" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrow-grey)" marker-start="url(#arrow-grey-left)"/>
  <rect x="358" y="626" width="244" height="26" rx="4" fill="#EFEFEF" stroke="#AAA" stroke-width="1"/>
  <text x="480" y="638" text-anchor="middle" font-size="10" fill="#555">Physical material exchange</text>
  <text x="480" y="651" text-anchor="middle" font-size="9" fill="#888">wafers · dies · partial assemblies</text>

</svg>

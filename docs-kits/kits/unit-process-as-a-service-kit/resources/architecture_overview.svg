  <text x="480" y="92" text-anchor="middle" font-size="10" fill="#C5CAE9">Service request · Offer matching · Contract</text>

  <!-- Marketplace → Requester (dashed blue) -->
  <line x1="355" y1="79" x2="190" y2="79" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="190" y1="79" x2="190" y2="128" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Marketplace → Provider (dashed blue) -->
  <line x1="605" y1="79" x2="770" y2="79" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="770" y1="79" x2="770" y2="128" stroke="#5C6BC0" stroke-width="1.5" stroke-dasharray="5,3"/>


  <rect x="679" y="369" width="112" height="92" rx="4" fill="#EAF5EA" stroke="#4A8C4A" stroke-width="1"/>
  <text x="735" y="386" text-anchor="middle" font-size="10" font-weight="bold" fill="#2D5A2D">Control Plane</text>
  <text x="735" y="401" text-anchor="middle" font-size="9" fill="#444">Catalog publication</text>
  <text x="735" y="415" text-anchor="middle" font-size="9" fill="#444">Contract negotiation</text>
  <text x="735" y="429" text-anchor="middle" font-size="9" fill="#444">ODRL policy def.</text>
  <text x="735" y="451" text-anchor="middle" font-size="8" fill="#777">DSP Protocol</text>
  <!-- DP -->
  <rect x="799" y="369" width="112" height="92" rx="4" fill="#EAF5EA" stroke="#4A8C4A" stroke-width="1"/>
  <text x="855" y="386" text-anchor="middle" font-size="10" font-weight="bold" fill="#2D5A2D">Data Plane</text>
  <text x="855" y="401" text-anchor="middle" font-size="9" fill="#444">AAS package host</text>
  <text x="855" y="415" text-anchor="middle" font-size="9" fill="#444">EDR provisioning</text>
  <text x="855" y="429" text-anchor="middle" font-size="9" fill="#444">Secure serving</text>
  <text x="855" y="451" text-anchor="middle" font-size="8" fill="#777">HTTPS</text>

  <!-- Decentralized Wallet (Provider) -->
  <rect x="669" y="482" width="251" height="44" rx="6" fill="white" stroke="#C87034" stroke-width="1.5"/>
  <text x="794" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#7A3E10">Decentralized Wallet</text>
  <text x="794" y="517" text-anchor="middle" font-size="10" fill="#666">Verifiable Credentials · Identity tokens</text>

  <!-- Equipment Interfaces — moved down to y=536 -->
  <rect x="669" y="536" width="251" height="44" rx="6" fill="white" stroke="#C87034" stroke-width="1.5"/>
  <text x="794" y="555" text-anchor="middle" font-size="11" font-weight="bold" fill="#7A3E10">Equipment Interfaces</text>
  <text x="794" y="572" text-anchor="middle" font-size="10" fill="#666">OPC UA · Semi SECS/GEM (E5/E30)</text>

